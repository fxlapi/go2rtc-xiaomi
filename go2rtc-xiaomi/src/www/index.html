<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>go2rtc</title>
<style>
:root{
  --bg:#0f1115;--bg2:#161a22;--card:#1b2029;--line:#262c38;
  --txt:#e8ebf1;--dim:#8b93a7;--acc:#4f8cff;--acc2:#3a6fd8;
  --ok:#3fbf6f;--warn:#ffb020;--err:#ff5c5c;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
::placeholder{color:#5a6275}

/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:0 18px;display:flex;align-items:center;gap:18px;height:52px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.brand .dot.off{background:var(--err);box-shadow:none}
nav{display:flex;gap:4px;flex:1}
nav button{padding:7px 14px;border-radius:8px;color:var(--dim);font-size:13.5px}
nav button:hover{color:var(--txt);background:var(--bg2)}
nav button.on{color:var(--txt);background:var(--card);font-weight:500}
.ver{font-size:12px;color:var(--dim);white-space:nowrap}

main{max-width:1500px;margin:0 auto;padding:16px 18px 40px}
.page{display:none}.page.on{display:block}

/* ── 画面页 ── */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px;user-select:none}
.chip input{accent-color:var(--acc);cursor:pointer;margin:0;padding:0}
.chip.on{border-color:var(--acc);background:rgba(79,140,255,.12)}
.mini{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;color:var(--txt)}
.mini:hover{border-color:var(--acc)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,2),1fr)}
.tile{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;cursor:pointer}
.tile:fullscreen{border-radius:0;aspect-ratio:auto}
.tile.dragging{opacity:.35}
.tile:not(.dragging):hover{outline:2px solid rgba(255,255,255,.22)}
.tile video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.tile .lbl{position:absolute;left:10px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;
  padding:3px 9px;border-radius:6px;pointer-events:none}
.tile .tools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.tile .tools button{background:rgba(0,0,0,.55);color:#fff;border-radius:6px;width:28px;height:28px;font-size:14px;line-height:1}
.tile .tools button:hover{background:rgba(0,0,0,.85)}
.tile .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--warn);font-size:13px;text-align:center;padding:12px;background:rgba(0,0,0,.7)}
.empty{color:var(--dim);font-size:14px;padding:40px;text-align:center}
@media (max-width:700px){.grid{grid-template-columns:1fr}}

/* ── 流管理 ── */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{color:var(--dim);font-weight:500;background:var(--bg2)}
td .src{color:var(--dim);word-break:break-all;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
td .nm{font-weight:500}
.rowbtn{display:flex;gap:6px}
.rowbtn button{padding:4px 10px;border-radius:7px;font-size:12.5px;background:var(--bg2);border:1px solid var(--line)}
.rowbtn button:hover{border-color:var(--acc)}
.rowbtn button.danger:hover{border-color:var(--err);color:var(--err)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:rgba(63,191,111,.15);color:var(--ok)}
.badge.idle{background:rgba(139,147,167,.15);color:var(--dim)}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
.form h3{font-size:14px;margin-bottom:12px;color:var(--txt)}
.form .frow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form .frow>label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--dim);flex:1;min-width:220px}
.form .frow input,.form .frow select{width:100%}
.form .acts{display:flex;gap:8px;align-items:center}
.btn{background:var(--acc);color:#fff;border-radius:8px;padding:8px 18px;font-size:13.5px}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:var(--bg2);border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:var(--acc)}
.hint{font-size:12px;color:var(--dim);margin-top:8px}

/* ── 日志 ── */
.logbox{background:#0a0c10;border:1px solid var(--line);border-radius:var(--radius);padding:12px;
  font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;
  height:calc(100vh - 200px);overflow:auto;color:#b7c0d0}
.logbox .lv-err{color:var(--err)}.logbox .lv-warn{color:var(--warn)}.logbox .lv-info{color:#9fb6d8}

/* ── 配置 ── */
.cfgbox{display:flex;flex-direction:column;gap:12px}
textarea.yaml{width:100%;height:calc(100vh - 240px);resize:vertical;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;
  background:#0a0c10;border-color:var(--line);padding:14px;border-radius:var(--radius)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 18px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:99;display:none}
.toast.err{border-color:var(--err);color:var(--err)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot" id="hdot"></span>go2rtc</div>
  <nav>
    <button data-p="live" class="on">画面</button>
    <button data-p="streams">流管理</button>
    <button data-p="log">日志</button>
    <button data-p="cfg">配置</button>
  </nav>
  <div class="ver" id="ver"></div>
</header>
<main>
  <section class="page on" id="p-live">
    <div class="bar" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="gempty" style="display:none">还没有勾选摄像头，点上面的名字勾选即可，勾选会记住，下次打开自动播放。</div>
  </section>

  <section class="page" id="p-streams">
    <div class="toolbar">
      <button class="mini" id="refreshStreams">刷新列表</button>
    </div>
    <div class="form" id="miCard">
      <h3>小米账号登录</h3>
      <div class="frow" id="miStepLogin">
        <label>账号（手机号 / 邮箱）<input id="miUser" autocomplete="username" placeholder="小米账号"></label>
        <label>密码<input id="miPass" type="password" autocomplete="current-password" placeholder="账号密码"></label>
      </div>
      <div class="frow" id="miStepVerify" style="display:none">
        <label id="miVerifyHint">短信验证码<input id="miVerify" inputmode="numeric" placeholder="6 位验证码"></label>
      </div>
      <div class="frow" id="miStepCaptcha" style="display:none">
        <label>图形验证码<img id="miCaptchaImg" alt="验证码" style="height:38px;border-radius:6px;display:block;margin-top:4px">
          <input id="miCaptcha" placeholder="图中字符"></label>
      </div>
      <div class="acts">
        <button class="btn" id="miLoginBtn">登录</button>
        <span class="hint" id="miHint"></span>
      </div>
      <div id="miDevices"></div>
      <div class="hint">登录一次即可，账号凭证保存在本机配置里，之后打开会自动列出摄像头，点「添加」即可接入。</div>
    </div>
    <table>
      <thead><tr><th style="width:180px">名称</th><th>来源</th><th style="width:90px">状态</th><th style="width:190px">操作</th></tr></thead>
      <tbody id="stbody"><tr><td colspan="4" style="color:var(--dim)">读取中…</td></tr></tbody>
    </table>
    <div class="form">
      <h3 id="formTitle">添加流</h3>
      <div class="frow">
        <label>名称<input id="fName" placeholder="例如：zhuwo"></label>
        <label>来源模板
          <select id="fTpl">
            <option value="xiaomi">小米摄像头（xiaomi://）</option>
            <option value="rtsp">RTSP 摄像头</option>
            <option value="rtmp">RTMP 推流</option>
            <option value="file">本地文件</option>
            <option value="">自定义</option>
          </select>
        </label>
      </div>
      <div class="frow">
        <label style="flex:3">来源地址<input id="fSrc" placeholder="xiaomi://用户名:密码@192.168.1.123?did=设备ID&model=型号"></label>
      </div>
      <div class="acts">
        <button class="btn" id="fSave">保存</button>
        <button class="btn ghost" id="fReset">清空表单</button>
        <span class="hint" id="fHint"></span>
      </div>
      <div class="hint">保存会写入 go2rtc 的配置文件并立即生效；删除同样会从配置中移除。</div>
    </div>
  </section>

  <section class="page" id="p-log">
    <div class="toolbar">
      <button class="mini" id="logPause">暂停刷新</button>
      <button class="mini" id="logClear">清空日志</button>
      <label class="chip" style="padding:4px 10px"><input type="checkbox" id="logErrOnly"><span>只看警告/错误</span></label>
    </div>
    <div class="logbox" id="logbox">读取中…</div>
  </section>

  <section class="page" id="p-cfg">
    <div class="cfgbox">
      <div class="toolbar" style="margin:0">
        <button class="btn" id="cfgSave">保存配置</button>
        <button class="btn ghost" id="cfgSaveRestart">保存并重启</button>
        <button class="btn ghost" id="cfgReload">重新读取</button>
        <span class="hint" id="cfgHint"></span>
      </div>
      <textarea class="yaml" id="cfgText" spellcheck="false"></textarea>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* go2rtc (xiaomi) 整合界面 — 打开即播放
 * 画面页：MSE over WebSocket 直连 go2rtc /api/ws（与官方 stream.html 同协议）
 * 流管理：/api/streams 增删改（写入配置文件）
 * 日志：/api/log 轮询；配置：/api/config 读写 */

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];

/* 兼容 HA ingress 等反向代理子路径：以当前页面路径推导 API 前缀 */
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname.replace(/[^/]*$/, "");
const API = BASE + "api";

const SEL_KEY = "g2panel.live.sel";
const ORDER_KEY = "g2panel.live.order";
const CAM_NAMES = {
  houyuan1: "后院 1", houyuan2: "后院 2", diannao: "电脑房", erlou: "二楼",
  ChuFang: "厨房", yilou: "一楼", dianshi: "电视", zhuwo: "主卧",
};
const camName = (k) => CAM_NAMES[k] || k;

const CODECS = [
  "avc1.640029", "avc1.64002A", "avc1.640033",
  "hvc1.1.6.L153.B0",
  "mp4a.40.2", "mp4a.40.5", "flac", "opus",
];
const MSE_CODECS = (() => {
  if (!("MediaSource" in window)) return "";
  return CODECS.filter((c) => {
    try { return MediaSource.isTypeSupported(`video/mp4; codecs="${c}"`); }
    catch (e) { return false; }
  }).join();
})();

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, 2600);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) throw new Error("需要登录（浏览器未保存 go2rtc 的账号密码）");
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r;
}
const jget = async (p) => (await api(p)).json();

/* ─────────── 页面切换 ─────────── */
const pageInit = {};
$$("nav button").forEach((b) => {
  b.onclick = () => {
    $$("nav button").forEach((x) => x.classList.toggle("on", x === b));
    $$(".page").forEach((p) => p.classList.toggle("on", p.id === "p-" + b.dataset.p));
    if (pageInit[b.dataset.p]) pageInit[b.dataset.p]();
  };
});

/* ─────────── 画面页 ─────────── */
const Live = {
  CAMS: [], SEL: loadSet(SEL_KEY), ORDER: loadArr(ORDER_KEY),
  PLAYERS: {}, RETRIES: {},
  orderedSel() {
    const out = this.ORDER.filter((n) => this.SEL.has(n));
    for (const n of this.SEL) if (!out.includes(n)) out.push(n);
    return out;
  },
  orderedCams() {
    const known = this.ORDER.filter((n) => this.CAMS.includes(n));
    return known.concat(this.CAMS.filter((n) => !known.includes(n)));
  },
};
function loadSet(k) { try { const v = JSON.parse(localStorage.getItem(k) || "[]"); return new Set(Array.isArray(v) ? v : []); } catch (e) { return new Set(); } }
function saveSet(k, s) { try { localStorage.setItem(k, JSON.stringify([...s])); } catch (e) {} }
function loadArr(k) { try { const v = JSON.parse(localStorage.getItem(k) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function saveArr(k, a) { try { localStorage.setItem(k, JSON.stringify(a)); } catch (e) {} }

pageInit.live = async () => {
  if (Live.CAMS.length) return;
  try {
    const d = await jget(API + "/streams");
    Live.CAMS = Object.keys(d);
    renderChips(); renderGrid();
    for (const n of Live.CAMS) if (Live.SEL.has(n)) play(n);
  } catch (e) { toast("读取摄像头列表失败：" + e.message, true); }
};

function renderChips() {
  const bar = $("#chips");
  bar.innerHTML = Live.orderedCams().map((n) => `
    <label class="chip${Live.SEL.has(n) ? " on" : ""}" data-name="${n}">
      <input type="checkbox" ${Live.SEL.has(n) ? "checked" : ""}><span>${camName(n)}</span>
    </label>`).join("") + `
    <button class="mini" id="allOn">全选</button>
    <button class="mini" id="allOff">清空</button>`;
  $$(".chip", bar).forEach((chip) => {
    chip.querySelector("input").onchange = (e) => {
      const n = chip.dataset.name;
      if (e.target.checked) Live.SEL.add(n); else Live.SEL.delete(n);
      saveSet(SEL_KEY, Live.SEL);
      chip.classList.toggle("on", e.target.checked);
      renderGrid();
      if (e.target.checked) play(n); else stop(n);
    };
  });
  $("#allOn").onclick = () => { Live.CAMS.forEach((n) => Live.SEL.add(n)); saveSet(SEL_KEY, Live.SEL); renderChips(); renderGrid(); Live.CAMS.forEach(play); };
  $("#allOff").onclick = () => { Live.CAMS.forEach((n) => { Live.SEL.delete(n); stop(n); }); saveSet(SEL_KEY, Live.SEL); renderChips(); renderGrid(); };
}

function renderGrid() {
  const grid = $("#grid");
  const want = Live.orderedSel();
  $$(".tile", grid).forEach((t) => { if (!want.includes(t.dataset.name)) t.remove(); });
  want.forEach((n) => {
    let tile = $(`.tile[data-name="${n}"]`, grid);
    if (!tile) {
      tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.name = n;
      tile.innerHTML = `
        <video muted playsinline autoplay></video>
        <div class="lbl">${camName(n)}</div>
        <div class="tools">
          <button class="mute" title="静音 / 取消静音">🔇</button>
          <button class="close" title="停止播放">×</button>
        </div>`;
      wireTile(tile, n);
    }
    grid.appendChild(tile);
    const v = tile.querySelector("video");
    if (v && Live.PLAYERS[n]) v.play().catch(() => {});
  });
  const n = Live.SEL.size;
  grid.style.setProperty("--cols", n <= 1 ? 1 : n <= 4 ? 2 : 3);
  $("#gempty").style.display = n ? "none" : "";
}

function wireTile(tile, n) {
  const grid = $("#grid");
  tile.draggable = true;
  tile.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", n); e.dataTransfer.effectAllowed = "move"; tile.classList.add("dragging"); });
  tile.addEventListener("dragend", () => {
    tile.classList.remove("dragging");
    Live.ORDER = $$(".tile", grid).map((t) => t.dataset.name);
    saveArr(ORDER_KEY, Live.ORDER);
    $$(".tile video", grid).forEach((v) => v.play().catch(() => {}));
  });
  tile.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const drag = $(".dragging", grid);
    if (!drag || drag === tile) return;
    const rect = tile.getBoundingClientRect();
    const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
    const after = cols <= 1 ? (e.clientY - rect.top) > rect.height / 2 : (e.clientX - rect.left) > rect.width / 2;
    if (after) tile.after(drag); else tile.before(drag);
  });
  tile.ondblclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else tile.requestFullscreen().catch(() => {});
  };
  tile.querySelector(".mute").onclick = (e) => {
    const v = tile.querySelector("video");
    v.muted = !v.muted;
    e.target.textContent = v.muted ? "🔇" : "🔊";
  };
  tile.querySelector(".close").onclick = () => {
    Live.SEL.delete(n); saveSet(SEL_KEY, Live.SEL);
    stop(n); renderChips(); renderGrid();
  };
}

async function play(name) {
  if (Live.PLAYERS[name]) return;
  const tile = $(`.tile[data-name="${name}"]`);
  if (!tile) return;
  const video = tile.querySelector("video");

  const player = { ws: null, ms: null, sb: null, objUrl: null, buf: null, bufLen: 0, stopped: false, timer: null, lastAppend: 0, watchdog: null };
  Live.PLAYERS[name] = player;

  const showErr = (msg) => {
    let el = tile.querySelector(".err");
    if (!el) { el = document.createElement("div"); el.className = "err"; tile.appendChild(el); }
    el.textContent = msg;
  };
  const clearErr = () => { const el = tile.querySelector(".err"); if (el) el.remove(); };

  const feed = (data) => {
    const sb = player.sb;
    if (!sb) return;
    if (sb.updating || player.bufLen > 0) {
      if (!player.buf) player.buf = new Uint8Array(4 * 1024 * 1024);
      const b = data instanceof ArrayBuffer ? new Uint8Array(data) : data;
      if (player.bufLen + b.byteLength <= player.buf.byteLength) {
        player.buf.set(b, player.bufLen);
        player.bufLen += b.byteLength;
      } else {
        player.bufLen = 0;
        try {
          if (sb.buffered.length) video.currentTime = Math.max(0, sb.buffered.end(sb.buffered.length - 1) - 0.5);
        } catch (e) {}
      }
    } else {
      try { sb.appendBuffer(data); player.lastAppend = Date.now(); } catch (e) {}
    }
  };

  const onMime = (mime) => {
    const ms = player.ms;
    if (!ms) return;
    const sb = ms.addSourceBuffer(mime);
    sb.mode = "segments";
    player.sb = sb;
    sb.addEventListener("updateend", () => {
      try {
        if (!sb.updating && player.bufLen > 0) {
          try { sb.appendBuffer(player.buf.slice(0, player.bufLen)); player.bufLen = 0; player.lastAppend = Date.now(); } catch (e) {}
        }
        if (!sb.updating && sb.buffered && sb.buffered.length) {
          const end = sb.buffered.end(sb.buffered.length - 1);
          const start = end - 5;
          const start0 = sb.buffered.start(0);
          if (start > start0) { try { sb.remove(start0, start); ms.setLiveSeekableRange(start, end); } catch (e) {} }
          if (video.currentTime < start) video.currentTime = start;
          const gap = end - video.currentTime;
          if (gap > 10) { video.currentTime = Math.max(0, end - 1); video.playbackRate = 1; }
          else video.playbackRate = Math.min(Math.max(gap, 0.1), 2);
        }
      } catch (e) {}
    });
    video.play().catch(() => {});
    if (!player.watchdog) {
      player.watchdog = setInterval(() => {
        if (player.stopped) return;
        if (!player.ws || player.ws.readyState !== 1) return;
        if (player.lastAppend && Date.now() - player.lastAppend > 10000) {
          showErr("画面无响应，自动重连中…");
          scheduleReconnect(name, player);
        }
      }, 5000);
    }
    Live.RETRIES[name] = 0;
    clearErr();
  };

  const connect = () => {
    if (player.stopped || !Live.SEL.has(name)) return;
    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + BASE + "api/ws?src=" + encodeURIComponent(name);
    let ws;
    try { ws = new WebSocket(wsUrl); } catch (e) { showErr("连接失败：" + e); scheduleReconnect(name, player); return; }
    ws.binaryType = "arraybuffer";
    player.ws = ws;

    ws.onopen = () => {
      if (player.stopped) return;
      const ms = new MediaSource();
      player.ms = ms;
      ms.addEventListener("sourceopen", () => {
        if (player.stopped || !player.ws || player.ws.readyState > 1) return;
        try { player.ws.send(JSON.stringify({ type: "mse", value: MSE_CODECS })); } catch (e) {}
      }, { once: true });
      player.objUrl = URL.createObjectURL(ms);
      video.src = player.objUrl;
      video.play().catch(() => {});
      showErr("连接中…");
    };
    ws.onmessage = (ev) => {
      if (player.stopped) return;
      if (typeof ev.data === "string") {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg && msg.type === "mse" && msg.value) onMime(msg.value);
        else if (msg && msg.type === "error") showErr("流错误：" + (msg.value || "未知"));
      } else feed(ev.data);
    };
    ws.onclose = () => {
      if (player.stopped) return;
      scheduleReconnect(name, player);
      if (Live.SEL.has(name)) showErr("连接断开，重连中…");
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  };
  connect();
}

function scheduleReconnect(name, player) {
  if (player.stopped || player.timer) return;
  const wait = Math.min(30000, 2000 * Math.pow(2, Live.RETRIES[name] || 0));
  Live.RETRIES[name] = Math.min((Live.RETRIES[name] || 0) + 1, 5);
  player.timer = setTimeout(() => {
    player.timer = null;
    if (player.stopped || !Live.SEL.has(name)) return;
    destroyPlayer(player);
    delete Live.PLAYERS[name];
    play(name);
  }, wait);
}

function destroyPlayer(p) {
  if (!p) return;
  p.stopped = true;
  if (p.timer) { clearTimeout(p.timer); p.timer = null; }
  if (p.watchdog) { clearInterval(p.watchdog); p.watchdog = null; }
  if (p.ws) { try { p.ws.close(); } catch (e) {} p.ws = null; }
  if (p.ms) { try { if (p.ms.readyState === "open") p.ms.close(); } catch (e) {} p.ms = null; }
  if (p.objUrl) { URL.revokeObjectURL(p.objUrl); p.objUrl = null; }
  p.sb = null; p.buf = null; p.bufLen = 0;
}

function stop(name) {
  const p = Live.PLAYERS[name];
  if (!p) return;
  destroyPlayer(p);
  delete Live.PLAYERS[name];
  delete Live.RETRIES[name];
  const tile = $(`.tile[data-name="${name}"]`);
  if (tile) {
    const v = tile.querySelector("video");
    if (v) { try { v.pause(); } catch (e) {} v.removeAttribute("src"); v.load(); }
    const el = tile.querySelector(".err");
    if (el) el.remove();
  }
}

/* ─────────── 流管理 ─────────── */
const TPL = {
  xiaomi: (v) => `xiaomi://用户名:密码@摄像头IP?did=设备ID&model=型号`,
  rtsp:   (v) => `rtsp://用户名:密码@摄像头IP:554/...`,
  rtmp:   (v) => `rtmp://服务器地址/路径`,
  file:   (v) => `/media/xxx.mp4`,
};

/* ── 小米账号登录 ── */
const Mi = { pending: null, busy: false };

function miShow(step) {
  $("#miStepLogin").style.display = step === "login" ? "" : "none";
  $("#miStepVerify").style.display = step === "verify" ? "" : "none";
  $("#miStepCaptcha").style.display = step === "captcha" ? "" : "none";
}

async function miPost(params) {
  const body = new URLSearchParams(params).toString();
  const r = await fetch(API + "/xiaomi", { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } });
  if (r.ok) return { ok: true };
  if (r.status === 401) {
    let err = null;
    try { err = await r.json(); } catch (e) {}
    return { ok: false, err };
  }
  return { ok: false, text: (await r.text()) || String(r.status) };
}

$("#miLoginBtn").onclick = async () => {
  if (Mi.busy) return;
  Mi.busy = true;
  $("#miLoginBtn").disabled = true;
  $("#miHint").textContent = "登录中…";
  try {
    let res;
    if (Mi.pending === "verify") {
      res = await miPost({ verify: $("#miVerify").value.trim() });
    } else if (Mi.pending === "captcha") {
      res = await miPost({ captcha: $("#miCaptcha").value.trim() });
    } else {
      const u = $("#miUser").value.trim(), p = $("#miPass").value;
      if (!u || !p) { $("#miHint").textContent = "账号和密码都要填"; return; }
      res = await miPost({ username: u, password: p });
    }
    if (res.ok) {
      Mi.pending = null;
      miShow("login");
      $("#miPass").value = "";
      $("#miHint").textContent = "登录成功";
      loadMiDevices();
      return;
    }
    const err = res.err;
    if (err && err.verify_phone) {
      Mi.pending = "verify";
      miShow("verify");
      $("#miVerifyHint").firstChild.textContent = "短信验证码（已发送至 " + err.verify_phone + "）";
      $("#miHint").textContent = "";
      $("#miVerify").focus();
    } else if (err && err.verify_email) {
      Mi.pending = "verify";
      miShow("verify");
      $("#miVerifyHint").firstChild.textContent = "邮箱验证码（已发送至 " + err.verify_email + "）";
      $("#miHint").textContent = "";
      $("#miVerify").focus();
    } else if (err && err.captcha) {
      Mi.pending = "captcha";
      miShow("captcha");
      const b64 = err.captcha;
      const mime = b64.startsWith("iVBORw0KGgo") ? "image/png" : b64.startsWith("R0lGOD") ? "image/gif" : "image/jpeg";
      $("#miCaptchaImg").src = "data:" + mime + ";base64," + b64;
      $("#miHint").textContent = "";
      $("#miCaptcha").focus();
    } else {
      $("#miHint").textContent = "登录失败：" + (res.text || "请检查账号密码");
    }
  } catch (e) {
    $("#miHint").textContent = "登录失败：" + e.message;
  } finally {
    Mi.busy = false;
    $("#miLoginBtn").disabled = false;
  }
};

async function loadMiDevices() {
  const box = $("#miDevices");
  box.innerHTML = '<div class="hint">读取摄像头列表…</div>';
  try {
    const ids = await jget(API + "/xiaomi");
    if (!ids.length) {
      box.innerHTML = '<div class="hint">还没有登录过账号，用上面表单登录后即可选择摄像头。</div>';
      return;
    }
    const streams = await jget(API + "/streams");
    const existingDids = new Set();
    for (const st of Object.values(streams)) {
      for (const p of (st.producers || [])) {
        const m = (p.url || "").match(/did=(\d+)/);
        if (m) existingDids.add(m[1]);
      }
    }
    let html = "";
    for (const id of ids) {
      const d = await jget(API + "/xiaomi?id=" + encodeURIComponent(id) + "&region=cn");
      for (const s of (d.sources || [])) {
        const did = (s.url.match(/did=(\d+)/) || [])[1] || "";
        const added = did && existingDids.has(did);
        html += `<div class="frow" style="margin:0 0 6px;align-items:center">
          <label style="flex:1;min-width:200px;margin:0"><span class="nm">${esc(s.name)}</span><div style="font-size:11.5px;color:var(--dim)">${esc(s.info || "")}</div></label>
          ${added ? '<span class="badge">已添加</span>' : `<button class="btn" data-src="${esc(s.url)}" data-name="${esc(s.name)}" data-did="${esc(did)}">添加</button>`}
        </div>`;
      }
    }
    box.innerHTML = html || '<div class="hint">账号下没有找到摄像头设备。</div>';
    box.querySelectorAll("button[data-src]").forEach((b) => {
      b.onclick = () => miAddStream(b, box);
    });
  } catch (e) {
    box.innerHTML = `<div class="hint" style="color:var(--err)">读取失败：${esc(e.message)}</div>`;
  }
}

async function miAddStream(btn, box) {
  const src = btn.dataset.src, cloudName = btn.dataset.name, did = btn.dataset.did;
  let name = cloudName || ("camera" + (did || Date.now()));
  try {
    const streams = await jget(API + "/streams");
    if (streams[name]) {
      const same = (streams[name].producers || []).some((p) => (p.url || "").includes("did=" + did));
      if (!same) name = name + "-" + (did || Date.now());
    }
    btn.disabled = true;
    await api(`${API}/streams?name=${encodeURIComponent(name)}&src=${encodeURIComponent(src)}`, { method: "PUT" });
    toast("已添加 " + camName(name));
    btn.outerHTML = '<span class="badge">已添加</span>';
    loadStreams();
    refreshLiveCams();
  } catch (e) {
    toast("添加失败：" + e.message, true);
    btn.disabled = false;
  }
}

async function refreshLiveCams() {
  try {
    const d = await jget(API + "/streams");
    Live.CAMS = Object.keys(d);
    renderChips(); renderGrid();
  } catch (e) {}
}

pageInit.streams = () => { loadStreams(); loadMiDevices(); };
async function loadStreams() {
  const tb = $("#stbody");
  try {
    const d = await jget(API + "/streams");
    const names = Object.keys(d);
    if (!names.length) { tb.innerHTML = `<tr><td colspan="4" style="color:var(--dim)">还没有配置任何流，用下面的表单添加。</td></tr>`; return; }
    tb.innerHTML = "";
    for (const n of names) {
      const st = d[n] || {};
      const src = (st.producers || []).map((p) => p.url || p.name || "").filter(Boolean).join("<br>") || "—";
      const cons = (st.consumers || []).length;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="nm">${esc(camName(n))}</span><div style="font-size:11.5px;color:var(--dim)">${esc(n)}</div></td>
        <td><span class="src">${esc(src)}</span></td>
        <td>${cons > 0 ? `<span class="badge">播放中 ×${cons}</span>` : `<span class="badge idle">空闲</span>`}</td>
        <td><div class="rowbtn">
          <button data-act="preview">预览</button>
          <button data-act="edit">编辑</button>
          <button data-act="del" class="danger">删除</button>
        </div></td>`;
      tr.querySelector('[data-act="preview"]').onclick = () => {
        Live.SEL.add(n); saveSet(SEL_KEY, Live.SEL);
        $$("nav button").find((b) => b.dataset.p === "live").click();
        renderChips(); renderGrid(); play(n);
      };
      tr.querySelector('[data-act="edit"]').onclick = () => {
        $("#formTitle").textContent = "编辑流：" + camName(n);
        $("#fName").value = n;
        $("#fSrc").value = (st.producers || []).map((p) => p.url || "").find(Boolean) || "";
        $("#fTpl").value = "";
        $("#fName").focus();
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      };
      tr.querySelector('[data-act="del"]').onclick = async () => {
        if (!confirm(`确定删除「${camName(n)}」吗？会从配置文件中移除。`)) return;
        try {
          await api(API + "/streams?src=" + encodeURIComponent(n), { method: "DELETE" });
          toast("已删除 " + camName(n));
          Live.SEL.delete(n); saveSet(SEL_KEY, Live.SEL); stop(n);
          loadStreams();
        } catch (e) { toast("删除失败：" + e.message, true); }
      };
      tb.appendChild(tr);
    }
  } catch (e) { tb.innerHTML = `<tr><td colspan="4" style="color:var(--err)">读取失败：${e.message}</td></tr>`; }
}
$("#refreshStreams").onclick = loadStreams;

$("#fTpl").onchange = () => {
  const v = $("#fTpl").value;
  if (v && TPL[v]) $("#fSrc").placeholder = TPL[v]();
};
$("#fReset").onclick = () => {
  $("#formTitle").textContent = "添加流";
  $("#fName").value = ""; $("#fSrc").value = ""; $("#fTpl").value = "xiaomi";
};
$("#fSave").onclick = async () => {
  const name = $("#fName").value.trim();
  const src = $("#fSrc").value.trim();
  if (!name || !src) { toast("名称和来源都要填", true); return; }
  try {
    await api(`${API}/streams?name=${encodeURIComponent(name)}&src=${encodeURIComponent(src)}`, { method: "PUT" });
    toast("已保存 " + camName(name));
    $("#fReset").click();
    loadStreams();
  } catch (e) { toast("保存失败：" + e.message, true); }
};

/* ─────────── 日志 ─────────── */
const Log = { paused: false, timer: null, errOnly: false, last: "" };
pageInit.log = () => {
  if (Log.timer) return;
  fetchLog();
  Log.timer = setInterval(() => { if (!Log.paused) fetchLog(); }, 3000);
  $("#logPause").onclick = () => {
    Log.paused = !Log.paused;
    $("#logPause").textContent = Log.paused ? "恢复刷新" : "暂停刷新";
  };
  $("#logClear").onclick = async () => {
    try { await api(API + "/log", { method: "DELETE" }); fetchLog(); } catch (e) { toast("清空失败：" + e.message, true); }
  };
  $("#logErrOnly").onchange = (e) => { Log.errOnly = e.target.checked; renderLog(Log.last); };
};
async function fetchLog() {
  try {
    const txt = await (await api(API + "/log")).text();
    Log.last = txt;
    renderLog(txt);
  } catch (e) { $("#logbox").textContent = "读取失败：" + e.message; }
}
function renderLog(txt) {
  const box = $("#logbox");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  const lines = txt.split("\n").filter(Boolean);
  const shown = Log.errOnly
    ? lines.filter((l) => { try { const j = JSON.parse(l); return j.level === "error" || j.level === "warn"; } catch (e) { return true; } })
    : lines;
  box.innerHTML = shown.map((l) => {
    try {
      const j = JSON.parse(l);
      const cls = j.level === "error" ? "lv-err" : j.level === "warn" ? "lv-warn" : "lv-info";
      const t = j.time ? new Date(j.time).toLocaleTimeString("zh-CN", { hour12: false }) : "";
      return `<span class="${cls}">${esc(`${t} [${j.level}] ${j.message || ""}${j.error ? " " + j.error : ""}`)}</span>`;
    } catch (e) { return `<span>${esc(l)}</span>`; }
  }).join("\n");
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* ─────────── 配置 ─────────── */
pageInit.cfg = loadConfig;
async function loadConfig() {
  try {
    $("#cfgText").value = await (await api(API + "/config")).text();
    $("#cfgHint").textContent = "";
  } catch (e) { toast("读取配置失败：" + e.message, true); }
}
async function saveConfig() {
  const body = $("#cfgText").value;
  try {
    await api(API + "/config", { method: "POST", body, headers: { "Content-Type": "application/yaml" } });
    return true;
  } catch (e) { toast("保存失败：" + e.message, true); return false; }
}
$("#cfgSave").onclick = async () => {
  if (!confirm("确定保存配置吗？保存后立即生效（部分改动需重启）。")) return;
  if (await saveConfig()) toast("配置已保存");
};
$("#cfgSaveRestart").onclick = async () => {
  if (!confirm("保存并重启 go2rtc？重启期间画面会中断几秒。")) return;
  if (!(await saveConfig())) return;
  try { await api(API + "/restart", { method: "POST" }); toast("已保存，go2rtc 重启中…"); }
  catch (e) { toast("已保存；重启请求失败：" + e.message, true); }
};
$("#cfgReload").onclick = loadConfig;

/* ─────────── 启动 ─────────── */
(async () => {
  try {
    const info = await jget(API);
    $("#ver").textContent = "v" + (info.version || "").split("+")[0].trim();
    $("#ver").title = info.config_path || "";
  } catch (e) { $("#hdot").classList.add("off"); }
  pageInit.live();
})();
window.addEventListener("beforeunload", () => { Object.keys(Live.PLAYERS).forEach(stop); });
</script>
